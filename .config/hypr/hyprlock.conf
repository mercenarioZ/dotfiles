general {
    hide_cursor = true
    grace = 2
    ignore_empty_input = true
}

background {
    monitor =
    path = /home/mercenarioz/Pictures/wallpapers/Sunset-room.png
    color = rgba(090a0cff)
    blur_passes = 2
    blur_size = 5
    brightness = 0.55
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(f5f0e6ff)
    font_size = 84
    font_family = JetBrains Mono
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(b8b1a7ff)
    font_size = 17
    font_family = JetBrains Mono
    position = 0, 48
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 54
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.42
    dots_center = true
    outer_color = rgba(f5b257ff)
    inner_color = rgba(121315e8)
    font_color = rgba(f5f0e6ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##b8b1a7">Password</span>
    hide_input = false
    position = 0, -64
    halign = center
    valign = center
}
