# Stable fallback for a Hyprlang-backed session.
# Hyprland 0.56 loads ~/.config/hypr/hyprland.lua directly.

bindd = SUPER, RETURN, Open terminal, exec, ghostty
bindd = SUPER, E, Open files, exec, thunar
bindd = SUPER, B, Open browser, exec, xdg-open https://
bindd = SUPER, D, Open launcher, global, quickshell:launcher
bindd = SUPER, SPACE, Open launcher, global, quickshell:launcher
bindd = SUPER, O, Open control drawer, global, quickshell:drawer
bindd = SUPER, ESCAPE, Open session menu, global, quickshell:session
bindd = CTRL ALT, L, Lock session, exec, hyprlock
bindd = CTRL ALT, DELETE, Open session menu, global, quickshell:session

bindd = SUPER, Q, Close window, killactive
bindd = SUPER, V, Toggle floating, togglefloating
bindd = SUPER, F, Toggle maximize, fullscreen, 1
bindd = SUPER SHIFT, F, Toggle fullscreen, fullscreen, 0
bindd = SUPER, P, Toggle pseudotile, pseudo
bindd = SUPER, J, Toggle split direction, layoutmsg, togglesplit
bindd = SUPER, G, Toggle window group, togglegroup
bindd = SUPER, TAB, Focus next window, cyclenext
bindd = SUPER SHIFT, TAB, Focus previous window, cyclenext, prev

bindd = SUPER, LEFT, Focus left, movefocus, l
bindd = SUPER, RIGHT, Focus right, movefocus, r
bindd = SUPER, UP, Focus up, movefocus, u
bindd = SUPER, DOWN, Focus down, movefocus, d
bindd = SUPER CTRL, LEFT, Move window left, movewindow, l
bindd = SUPER CTRL, RIGHT, Move window right, movewindow, r
bindd = SUPER CTRL, UP, Move window up, movewindow, u
bindd = SUPER CTRL, DOWN, Move window down, movewindow, d
binded = SUPER SHIFT, LEFT, Resize window left, resizeactive, -48 0
binded = SUPER SHIFT, RIGHT, Resize window right, resizeactive, 48 0
binded = SUPER SHIFT, UP, Resize window up, resizeactive, 0 -48
binded = SUPER SHIFT, DOWN, Resize window down, resizeactive, 0 48
bindmd = SUPER, mouse:272, Drag window, movewindow
bindmd = SUPER, mouse:273, Resize window, resizewindow

bindd = SUPER, 1, Workspace 1, workspace, 1
bindd = SUPER, 2, Workspace 2, workspace, 2
bindd = SUPER, 3, Workspace 3, workspace, 3
bindd = SUPER, 4, Workspace 4, workspace, 4
bindd = SUPER, 5, Workspace 5, workspace, 5
bindd = SUPER, 6, Workspace 6, workspace, 6
bindd = SUPER, 7, Workspace 7, workspace, 7
bindd = SUPER, 8, Workspace 8, workspace, 8
bindd = SUPER, 9, Workspace 9, workspace, 9
bindd = SUPER, 0, Workspace 10, workspace, 10
bindd = SUPER SHIFT, 1, Move to workspace 1, movetoworkspace, 1
bindd = SUPER SHIFT, 2, Move to workspace 2, movetoworkspace, 2
bindd = SUPER SHIFT, 3, Move to workspace 3, movetoworkspace, 3
bindd = SUPER SHIFT, 4, Move to workspace 4, movetoworkspace, 4
bindd = SUPER SHIFT, 5, Move to workspace 5, movetoworkspace, 5
bindd = SUPER SHIFT, 6, Move to workspace 6, movetoworkspace, 6
bindd = SUPER SHIFT, 7, Move to workspace 7, movetoworkspace, 7
bindd = SUPER SHIFT, 8, Move to workspace 8, movetoworkspace, 8
bindd = SUPER SHIFT, 9, Move to workspace 9, movetoworkspace, 9
bindd = SUPER SHIFT, 0, Move to workspace 10, movetoworkspace, 10
bindd = SUPER, U, Toggle scratchpad, togglespecialworkspace, scratch
bindd = SUPER SHIFT, U, Move to scratchpad, movetoworkspacesilent, special:scratch
bindd = SUPER, mouse_down, Next workspace, workspace, e+1
bindd = SUPER, mouse_up, Previous workspace, workspace, e-1

bindeld = , XF86AudioRaiseVolume, Volume up, global, quickshell:volumeUp
bindeld = , XF86AudioLowerVolume, Volume down, global, quickshell:volumeDown
bindld = , XF86AudioMute, Toggle mute, global, quickshell:volumeMute
bindld = , XF86AudioMicMute, Toggle microphone, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindeld = , XF86MonBrightnessUp, Brightness up, global, quickshell:brightnessUp
bindeld = , XF86MonBrightnessDown, Brightness down, global, quickshell:brightnessDown
bindld = , XF86AudioPlay, Play or pause, exec, playerctl play-pause
bindld = , XF86AudioPause, Play or pause, exec, playerctl play-pause
bindld = , XF86AudioNext, Next track, exec, playerctl next
bindld = , XF86AudioPrev, Previous track, exec, playerctl previous

bindd = , PRINT, Screenshot, exec, mkdir -p $HOME/Pictures/Screenshots; grim $HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bindd = SHIFT, PRINT, Screenshot region, exec, mkdir -p $HOME/Pictures/Screenshots; grim -g "$(slurp)" $HOME/Pictures/Screenshots/$(date +%Y-%m-%d_%H-%M-%S).png
bindd = SUPER SHIFT, S, Annotate screenshot, exec, grim -g "$(slurp)" - | swappy -f -
