# Hyprlang fallback for older sessions and recovery.
# Hyprland 0.56 selects hyprland.lua on a fresh start.
autogenerated = 0

monitor = eDP-1, preferred, auto, 1

general {
    gaps_in = 6
    gaps_out = 10
    border_size = 2
    resize_on_border = true
    extend_border_grab_area = 10
    layout = dwindle
    col.active_border = rgba(f5b257ff) rgba(f1d39bff) 42deg
    col.inactive_border = rgba(302d2aff)
}

decoration {
    rounding = 12
    active_opacity = 1
    inactive_opacity = 0.96
    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = rgba(05060799)
    }
    blur {
        enabled = true
        size = 4
        passes = 2
        ignore_opacity = true
        xray = false
    }
}

input {
    kb_layout = us
    repeat_rate = 50
    repeat_delay = 300
    follow_mouse = 1
    sensitivity = 0
    numlock_by_default = true
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# Tune the built-in touchpad without changing external mouse behavior.
device {
    name = dell09ce:00-06cb:76b1-touchpad
    sensitivity = 0.25
    scroll_factor = 0.65
}

dwindle {
    preserve_split = true
    smart_resizing = true
    use_active_for_splits = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vrr = 0
    middle_click_paste = false
}

source = ~/.config/hypr/hyprland-compat.conf
