"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$directory\
$git_branch\
$git_status\
$c\
$cpp\
$elixir\
$elm\
$gradle\
$haskell\
$julia\
$kotlin\
$nim\
$php\
$rust\
$scala\
$golang\
$java\
$nodejs\
$python\
$conda\
$docker_context\
$pixi\
$line_break\
$character
"""

[username]
disabled = false
show_always = false
style_user = "green"
style_root = "bold red"
format = '[$user]($style) '

[directory]
disabled = false
style = "bold cyan"
format = "[ $path]($style) "
truncation_length = 2
truncation_symbol = ".../"

[character]
format = '$symbol '
success_symbol = '[>](green)'
error_symbol = '[>](bold red)'
vimcmd_symbol = '[<](green)'
vimcmd_replace_one_symbol = '[<](purple)'
vimcmd_replace_symbol = '[<](purple)'
vimcmd_visual_symbol = '[<](yellow)'

[git_branch]
symbol = ""
style = "yellow"
format = '[$symbol $branch]($style) '
truncation_length = 16
truncation_symbol = "..."

[git_status]
disabled = false
style = "yellow"
format = '([$all_status$ahead_behind]($style))'
conflicted = '=$count '
ahead = '↑$count '
behind = '↓$count '
diverged = '↑$ahead_count ↓$behind_count '
up_to_date = ''
untracked = '?$count '
stashed = '\$$count '
modified = '!$count '
staged = '+$count '
renamed = '»$count '
deleted = '✘$count '
typechanged = '~$count '

[conda]
style = "green"
format = '[conda $environment]($style) '
ignore_base = false

[docker_context]
style = "green"
format = '[docker $context]($style) '

[pixi]
style = "green"
format = '[pixi( $version)( $environment)]($style) '

[c]
style = "purple"
format = '[c( $version)]($style) '

[cpp]
style = "purple"
format = '[cpp( $version)]($style) '

[elixir]
style = "purple"
format = '[elixir( $version)]($style) '

[elm]
style = "purple"
format = '[elm( $version)]($style) '

[golang]
style = "purple"
format = '[go( $version)]($style) '

[gradle]
style = "purple"
format = '[gradle( $version)]($style) '

[haskell]
style = "purple"
format = '[haskell( $version)]($style) '

[java]
style = "purple"
format = '[java( $version)]($style) '

[julia]
style = "purple"
format = '[julia( $version)]($style) '

[kotlin]
style = "purple"
format = '[kotlin( $version)]($style) '

[nodejs]
style = "purple"
format = '[node( $version)]($style) '
detect_files = ["package.json"]
detect_extensions = ["js", "ts"]
detect_folders = ["node_modules"]

[nim]
style = "purple"
format = '[nim( $version)]($style) '

[php]
style = "purple"
format = '[php( $version)]($style) '

[python]
style = "purple"
format = '[python( $version)( $virtualenv)]($style) '

[rust]
style = "purple"
format = '[rust( $version)]($style) '

[scala]
style = "purple"
format = '[scala( $version)]($style) '
