"$schema" = 'https://starship.rs/config-schema.json'

palette = 'pastel_brite'
# [pastel, pastel_brite, catppuccin_mocha]

format = """
[╭](gray)\
[](bg0)\
$os\
$username\
[](fg:bg0 bg:bg1)\
$directory\
[](fg:bg1 bg:bg2)\
$git_branch\
$git_status\
[](fg:bg2 bg:bg3)\
$c\
$cpp\
$elixir\
$elm\
$gradle\
$haskell\
$julia\
$kotlin\
$nim\
$php\
$rust\
$scala\
[](fg:bg3)\
$cmd_duration\
$fill\
$golang\
$java\
$nodejs\
$python\
$conda\
$docker_context\
$pixi\
$time\
$line_break\
[╰](gray)\
$character
"""

[fill]
symbol = " "

[username]
disabled = false
show_always = false
style_user = "bg:bg0 fg:text"
style_root = "bg:bg0 fg:text"
# symbol = "󰀄"
format = '[$user ]($style)'

[os]
disabled = false
style = "bg:bg0 fg:text"

[os.symbols]
Windows = "  "
Ubuntu = " 󰕈 "
SUSE = "  "
Raspbian = " 󰐿 "
Mint = " 󰣭 "
Macos = " 󰀵 "
Manjaro = "  "
Linux = " 󰌽 "
Gentoo = " 󰣨 "
Fedora = " 󰣛 "
Alpine = "  "
Amazon = "  "
Android = "  "
Arch = " 󰣇 "
Artix = " 󰣇 "
CentOS = "  "
Debian = " 󰣚 "
Redhat = " 󱄛 "
RedHatEnterprise = " 󱄛 "

[directory]
disabled = false
style = "bg:bg1 fg:text"
# home_symbol = ""
format = "[  $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"

[time]
disabled = false
time_format = "%R"
style = "bg:bg5 fg:text"
format = '[](fg:bg5)[  $time ]($style)[](fg:bg5)'

[cmd_duration]
disabled = false
show_milliseconds = true
show_notifications = false
min_time = 100
min_time_to_notify = 45000
format = "[  in $duration ]($style)"
style = "fg:lavender"

[character]
format = """
[╰─$symbol](fg:overlay1) """
success_symbol = '[](fg:green_bright)'
error_symbol = '[](fg:bold red)'

[git_branch]
symbol = ""
style = "bg:bg2 fg:text"
format = '[ $symbol $branch ]($style)'
truncation_length = 16
truncation_symbol = "…"

[git_status]
disabled = false
style = "bg:bg2 fg:text"
format = '[($all_status$ahead_behind)]($style)'

[conda]
symbol = ""
style = "bg:bg4 fg:text"
format = '[](fg:bg4)[ $symbol ($environment) ]($style)[](fg:bg4)'
ignore_base = false

[docker_context]
symbol = ""
style = "bg:bg4 fg:text"
format = '[](fg:bg4)[ $symbol ($context) ]($style)[](fg:bg4)'

[pixi]
style = "bg:bg4 fg:text"
format = '[](fg:bg4)[ $symbol ($version) ($environment) ]($style)[](fg:bg4)'

[c]
symbol = ""
style = "bg:bg3 fg:text"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = ""
style = "bg:bg3 fg:text"
format = '[ $symbol ($version) ]($style)'

[elixir]
symbol = ""
style = "bg:bg3 fg:text"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = ""
style = "bg:bg3 fg:text"
format = '[ $symbol ($version) ]($style)'

[golang]
symbol = ""
style = "bg:bg3 fg:text"
format = '[](fg:bg3)[ $symbol ($version) ]($style)[](fg:bg3)'

[gradle]
symbol = ""
style = "bg:bg3 fg:text"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = ""
style = "bg:bg3 fg:text"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = ""
style = "bg:bg3 fg:text"
format = '[](fg:bg3)[ $symbol ($version) ]($style)[](fg:bg3)'

[julia]
symbol = ""
style = "bg:bg3 fg:text"
format = '[ $symbol ($version) ]($style)'

[kotlin]
symbol = ""
style = "bg:bg3 fg:text"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = ""
style = "bg:bg3 fg:text"
format = '[](fg:bg3)[ $symbol ($version) ]($style)[](fg:bg3)'
detect_files = ["package.json"]
detect_extensions = ["js", "ts"]
detect_folders = ["node_modules"]

[nim]
symbol = "󰆥"
style = "bg:bg3 fg:text"
format = '[ $symbol ($version) ]($style)'

[php]
symbol = ""
style = "bg:bg3 fg:text"
format = '[ $symbol ($version) ]($style)'

[python]
symbol = ""
style = "bg:bg3 fg:text"
format = '[](fg:bg3)[ $symbol ($virtualenv) ]($style)[](fg:bg3)'

[rust]
symbol = ""
style = "bg:bg3 fg:text"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = ""
style = "bg:bg3 fg:text"
format = '[ $symbol ($version) ]($style)'

