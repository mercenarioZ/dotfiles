<svg xmlns="http://www.w3.org/2000/svg" width="2560" height="1440" viewBox="0 0 2560 1440">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07080a"/>
      <stop offset="0.55" stop-color="#101114"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="30%" r="48%">
      <stop offset="0" stop-color="#7a4a1e" stop-opacity="0.38"/>
      <stop offset="0.32" stop-color="#3a2818" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#090a0c" stop-opacity="0"/>
