set -g mouse on
set -g set-clipboard on

# action key
unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on

set-window-option -g mode-keys vi

# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

bind -r e kill-pane -a

# Moving window
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# basic settings
set-option -g status-justify "left"

# look'n feel
set-option -g status-fg cyan
set-option -g status-bg black
set -g pane-active-border-style fg=colour166,bg=default
set -g window-style fg=colour10,bg=default
set -g window-active-style fg=colour12,bg=default
set-option -g history-limit 64096

set -sg escape-time 10

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

source ~/.config/tmux/theme.conf
source ~/.config/tmux/statusline.conf

# Load platform-specific terminal, opener, and clipboard settings.
if-shell 'test "$(uname -s)" = "Darwin"' \
  'source-file ~/.config/tmux/macos.conf' \
  'source-file ~/.config/tmux/linux.conf'

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'

# TPM and its plugins are installed independently on each device.
if-shell 'test -x "$HOME/.config/tmux/plugins/tpm/tpm"' \
  'run-shell "$HOME/.config/tmux/plugins/tpm/tpm"'
