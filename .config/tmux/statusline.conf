set -g status-left-length 100
set -g status-right-length 100
set -g status-interval 15

set -g status-left "#[fg=#272e33,bg=#{?client_prefix,#e67e80,#a7c080}] #S #[default]#[fg=#5d6361]│"
set -g window-status-format         " #I #[default]#[fg=#7a8478] #W "
set -g window-status-current-format "#[fg=#272e33,bg=#ffde42] #I #[fg=#4d4955,bg=#ffde42] #W "
set -g window-status-separator ""

set -g status-right "#[fg=#859289]MercenarioZ  %a %d %b #(~/.config/tmux/working-hours.sh)"
