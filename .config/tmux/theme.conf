# everforest dark medium, same palette as nvim and ghostty
set -g status-style "fg=#859289,bg=default"

set -g message-style "fg=#d3c6aa,bg=#343f44,fill=#343f44,align=left"
set -g message-command-style "fg=#d3c6aa,bg=#343f44,fill=#343f44,align=left"

# selected row in choose-tree and copy-mode selection, default yellow is hard to read
set -g mode-style "fg=#d3c6aa,bg=#475258"
