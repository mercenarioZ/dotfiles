set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_window_text " #{=/12/…:#{b:pane_current_path}}"
set -g @catppuccin_window_current_text " #{b:pane_current_path}"

run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Let command prompts temporarily claim the full status row so they never
# collide with the window list or right-side modules.
set -gF message-style "fg=#{@thm_fg},bg=#{@thm_surface_0},fill=#{@thm_surface_0},align=left,width=100%"
set -gF message-command-style "fg=#{@thm_fg},bg=#{@thm_surface_0},fill=#{@thm_surface_0},align=left,width=100%"
